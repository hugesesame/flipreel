<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn still photos into a slideshow video, right in your browser. Works offline." />
    <meta name="color-scheme" content="light dark" />
    <title>Flip Reel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='20' height='16' rx='3' fill='%23f0c9b0'/%3E%3Crect x='9' y='10' width='20' height='16' rx='3' fill='%23c24e1c'/%3E%3Cpath d='M16.5 15.2v5.6l4.8-2.8z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('flipreel:theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Flip Reel needs JavaScript. / Flip Reel を使うには JavaScript を有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
